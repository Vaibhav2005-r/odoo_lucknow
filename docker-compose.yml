services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: loopbill
      POSTGRES_PASSWORD: loopbill
      POSTGRES_DB: loopbill
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loopbill"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  mail:
    image: axllent/mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web inbox: http://localhost:8025

  # Optional: the whole app in containers.  docker compose --profile app up --build
  api:
    profiles: ["app"]
    build: ./backend
    environment:
      DATABASE_URL: postgresql://loopbill:loopbill@db:5432/loopbill?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-before-real-use}
      CLIENT_URL: http://localhost:8080
      SMTP_HOST: mail
      SMTP_PORT: 1025
      TRUST_PROXY: 1
    depends_on:
      db:
        condition: service_healthy
  web:
    profiles: ["app"]
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
volumes:
  pgdata: {}

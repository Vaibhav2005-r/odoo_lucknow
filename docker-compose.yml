services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: loopbill
      POSTGRES_PASSWORD: loopbill
      POSTGRES_DB: loopbill
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  mail:
    image: axllent/mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web inbox: http://localhost:8025
volumes:
  pgdata: {}

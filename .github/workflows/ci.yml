name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: loopbill
          POSTGRES_PASSWORD: loopbill
          POSTGRES_DB: loopbill
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U loopbill"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://loopbill:loopbill@localhost:5432/loopbill?schema=public
      JWT_SECRET: ci-only-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Create the database from the committed migration
        run: npx prisma migrate deploy
      - name: Demo data, then 2,500 subscriptions so the performance test runs too
        run: |
          npm run seed
          npm run seed:bulk -- 2500
      - run: npm test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
